<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Hospital VidaNova</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #dff6ff, #b9e8f8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(70, 150, 180, 0.20);
            text-align: center;
        }

        .hospital-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            background: #b9e8f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            margin: 5px 0;
            color: #168aad;
            font-size: 28px;
        }

        .subtitulo {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #3d5666;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #c7e7f2;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            background: #f8fdff;
        }

        input:focus {
            border-color: #76cce5;
            box-shadow: 0 0 0 3px rgba(118, 204, 229, 0.18);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #72cce5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        button:hover {
            background: #4db6d4;
            transform: translateY(-1px);
        }

        #mensagem {
            margin-top: 18px;
            font-size: 14px;
            color: #d9534f;
        }

        .rodape {
            margin-top: 25px;
            color: #9aaab3;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="hospital-icon">
            🏥
        </div>

        <h1>Hospital VidaNova</h1>

        <div class="subtitulo">
            Sistema de Atendimento Hospitalar
        </div>

        <div class="campo">

            <label for="usuario">
                Usuário
            </label>

            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário"
            >

        </div>

        <div class="campo">

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
            >

        </div>

        <button onclick="login()">
            Entrar no sistema
        </button>

        <div id="mensagem"></div>

        <div class="rodape">
            Sistema Hospitalar • VidaNova
        </div>

    </div>


    <script>

        function login() {

            const usuario =
                document.getElementById("usuario").value.trim();

            const senha =
                document.getElementById("senha").value.trim();


            if (
                usuario === "atendimento" &&
                senha === "123"
            ) {

                window.location.href = "atendimento.html";

            } else {

                document.getElementById("mensagem").textContent =
                    "❌ Usuário ou senha incorretos.";

            }

        }

    </script>

</body>

</html>
